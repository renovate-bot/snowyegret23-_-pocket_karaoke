name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Calculate next version
        id: version
        shell: python
        run: |
          import os
          import re
          import subprocess

          subprocess.run(["git", "fetch", "--tags", "--force"], check=True)
          tag_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines()
          versions = []
          for tag in tags:
              match = tag_pattern.match(tag.strip())
              if match:
                  versions.append(tuple(int(part) for part in match.groups()))

          if not versions:
              major, minor, patch = 1, 0, 0
          else:
              major, minor, patch = max(versions)
              patch += 1
              if patch > 9:
                  patch = 0
                  minor += 1
              if minor > 9:
                  minor = 0
                  major += 1

          version = f"{major}.{minor}.{patch}"
          tag = f"v{version}"
          version_code = major * 10000 + minor * 100 + patch
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"version_code={version_code}\n")

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/PocketKaraoke-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "release/PocketKaraoke-${{ steps.version.outputs.tag }}.apk" \
            --target "${{ github.sha }}" \
            --title "Pocket Karaoke ${{ steps.version.outputs.version }}" \
            --notes "Automated release for ${{ github.sha }}."
